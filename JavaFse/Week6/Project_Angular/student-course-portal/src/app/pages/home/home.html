<h1>{{ portalName }}</h1>

<p>
  Welcome to the Student Course Portal.
  Browse courses and enroll easily.
</p>

<hr>

<!-- Stats Row -->
<h2>Dashboard</h2>

<div class="stats">
  <p><strong>Courses Available:</strong> {{ courseCount }}</p>
  <p><strong>Enrolled:</strong> 3</p>
  <p><strong>GPA:</strong> 3.8</p>
</div>

<hr>

<h2>Property Binding</h2>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<h2>Two-Way Binding</h2>

<input
  type="text"
  placeholder="Search course"
  [(ngModel)]="searchTerm">

<p>
  Searching for: {{ searchTerm }}
</p>
<hr>

<app-course-summary-widget></app-course-summary-widget>
<hr>

<app-notification></app-notification>
<!--
[property]
One-way binding:
Component -> DOM

[(ngModel)]
Two-way binding:
DOM <-> Component
-->
