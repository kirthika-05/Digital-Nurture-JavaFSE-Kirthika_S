<section class="student-profile">
  <h2>Student Profile</h2>

  <img [src]="profileImageUrl" [alt]="studentName" class="profile-img" />

  <div class="profile-details" *ngIf="!isEditing">
    <p><strong>Name:</strong> {{ studentName }}</p>
    <p><strong>Email:</strong> {{ studentEmail }}</p>
    <button (click)="toggleEdit()">Edit Profile</button>
  </div>

  <div class="profile-edit" *ngIf="isEditing">
    <label>
      Name:
      <input type="text" [(ngModel)]="studentName" name="studentName" />
    </label>
    <label>
      Email:
      <input type="email" [(ngModel)]="studentEmail" name="studentEmail" />
    </label>
    <button (click)="saveProfile()" [disabled]="isSaveDisabled">Save</button>
    <button (click)="toggleEdit()">Cancel</button>
  </div>
</section>
