<h1>Reactive Enrollment Form</h1>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <label>Student Name</label>

  <input
    type="text"
    formControlName="studentName">

  <br><br>

  <label>Student Email</label>

  <input
    type="email"
    formControlName="studentEmail">

  <div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
    Email already exists.
  </div>

  <br><br>

  <label>Course ID</label>

  <input
    type="text"
    formControlName="courseId">

  <div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
    Course code starting with XX is not allowed.
  </div>

  <br><br>

  <label>Semester</label>

  <select formControlName="preferredSemester">
    <option>Odd</option>
    <option>Even</option>
  </select>

  <br><br>

  <label>
    <input
      type="checkbox"
      formControlName="agreeToTerms">
    Agree Terms
  </label>

  <br><br>

  <button
    type="button"
    (click)="addCourse()">
    Add Another Course
  </button>

  <br><br>

  <div formArrayName="additionalCourses">

    <div *ngFor="let ctrl of additionalCourses.controls; let i = index">

      <input
        [formControl]="ctrl"
        placeholder="Additional Course">

      <button
        type="button"
        (click)="removeCourse(i)">
        Remove
      </button>

    </div>

  </div>

  <br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">
    Submit
  </button>

</form>
