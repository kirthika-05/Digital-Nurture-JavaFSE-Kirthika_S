<h1>{{ portalName }}</h1>

<p>
Welcome to the Student Course Portal.
Browse courses and enroll easily.
</p>

<hr>

<h2>Property Binding</h2>

<button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">

    Enroll Now

</button>

<p>{{ message }}</p>

<hr>

<h2>Two-Way Binding</h2>

<input
type="text"
placeholder="Search course"
[(ngModel)]="searchTerm">

<p>
Searching for:
{{ searchTerm }}
</p>

<!--
[property]
One-way binding:
Component -> DOM

[(ngModel)]
Two-way binding:
DOM <-> Component
-->
